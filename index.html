<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens - NodeReal only</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">só NodeReal • 8 chains • 100% RAW</p>
      </div>
      <div class="text-right text-xs"><div class="text-zinc-500">BNB</div><div id="bnbPrice" class="font-bold">...</div></div>
    </div>

    <div class="mt-6 flex gap-2">
      <input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm outline-none focus:border-white" placeholder="0x..." value="0x55d398326f99059fF775485246999027B319F875">
      <button id="btn" onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold">Rastrear via NodeReal</button>
    </div>

    <div id="status" class="mt-4 text-xs text-zinc-500"></div>
    <div id="chains" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    <div id="result" class="mt-6"></div>
    <div id="debug" class="mt-6 text- text-zinc-600 font-mono whitespace-pre-wrap"></div>
  </div>

<script type="module">
const CHAINS = [
  { id:'1', name:'Ethereum', explorer:'https://etherscan.io', color:'text-blue-400' },
  { id:'56', name:'BSC', explorer:'https://bscscan.com', color:'text-yellow-400' },
  { id:'137', name:'Polygon', explorer:'https://polygonscan.com', color:'text-purple-400' },
  { id:'8453', name:'Base', explorer:'https://basescan.org', color:'text-blue-300' },
  { id:'42161', name:'Arbitrum', explorer:'https://arbiscan.io', color:'text-cyan-400' },
  { id:'10', name:'Optimism', explorer:'https://optimistic.etherscan.io', color:'text-red-400' },
  { id:'43114', name:'Avalanche', explorer:'https://snowtrace.io', color:'text-red-300' },
  { id:'59144', name:'Linea', explorer:'https://lineascan.build', color:'text-zinc-300' },
];

async function callNodeReal(addr, chainId){
  const url = `/api/tokeninfo?address=${addr}&chain=${chainId}&action=tokeninfo`;
  const r = await fetch(url);
  const j = await r.json();
  return j;
}

window.check = async () => {
  const addr = document.getElementById('addr').value.trim();
  const status = document.getElementById('status');
  const chainsEl = document.getElementById('chains');
  const debugEl = document.getElementById('debug');
  const btn = document.getElementById('btn');

  if(!addr.startsWith('0x') || addr.length!==42) return alert('Endereço inválido');

  btn.disabled=true;
  status.textContent=`🔍 Varrendo ${CHAINS.length} chains via NodeReal...`;
  chainsEl.innerHTML = CHAINS.map(c=>`<div class="bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl animate-pulse">${c.name}...</div>`).join('');
  debugEl.textContent='';

  const results = await Promise.all(CHAINS.map(async (chain,i)=>{
    await new Promise(r=>setTimeout(r,i*250));
    try{
      const info = await callNodeReal(addr, chain.id);
      if(info.status==='1' && info.result?.[0]) return {chain, found:true, data:info.result[0], raw:info};
      return {chain, found:false, raw:info};
    }catch(e){ return {chain, found:false, raw:e.message}; }
  }));

  chainsEl.innerHTML = results.map(r=>{
    if(r.found){
      const d=r.data;
      return `<div class="bg-zinc-900 border border-green-900/50 rounded-xl p-4">
        <div class="font-bold ${r.chain.color}">${r.chain.name} (${r.chain.id}) • ENCONTRADO ✅</div>
        <div class="text-sm mt-1 font-bold">${d.tokenName} (${d.symbol})</div>
        <div class="text-xs text-zinc-500">Decimals: ${d.decimals} • <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-violet-400">[RAW NodeReal]</a></div>
        <a href="${r.chain.explorer}/address/${addr}" target="_blank" class="text-xs bg-white text-black px-3 py-1.5 rounded-full mt-3 inline-block font-bold">Explorer ↗</a>
      </div>`;
    }else{
      return `<div class="bg-zinc-900/30 border border-zinc-800 border-dashed p-3 rounded-xl opacity-50"><div class="text-xs text-zinc-500">${r.chain.name} (${r.chain.id}) • não encontrado</div></div>`;
    }
  }).join('');

  const found = results.filter(r=>r.found);
  status.innerHTML=`✅ NodeReal: encontrado em <b>${found.length}</b> de ${CHAINS.length} chains`;
  if(found.length===0) debugEl.textContent=`DEBUG: ${JSON.stringify(results[0].raw,null,2)}`;
  btn.disabled=false;
}
setTimeout(check,600);
</script>
</body>
</html>
