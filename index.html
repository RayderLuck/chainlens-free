<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chainlens - onde está a carteira</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">
<div class="max-w-3xl mx-auto">
<h1 class="text-3xl font-bold">🔭 chainlens</h1>
<p class="text-zinc-500 text-xs">cole a carteira e descubra em qual blockchain ela tem saldo</p>

<div class="flex gap-2 mt-6">
<input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm" placeholder="0x... sua carteira">
<button onclick="check()" class="px-6 bg-white text-black rounded-xl font-bold">Achar blockchain</button>
</div>

<div id="out" class="mt-6"></div>
</div>

<script>
const NAMES = {'1':'Ethereum','56':'BSC (BNB Chain)','137':'Polygon','8453':'Base','42161':'Arbitrum','10':'Optimism','43114':'Avalanche','59144':'Linea'};

async function check(){
  const addr = document.getElementById('addr').value.trim();
  const out = document.getElementById('out');
  out.innerHTML = '<div class="text-zinc-500 text-sm animate-pulse">Varrendo 8 blockchains via NodeReal...</div>';

  const r = await fetch(`/api/wallet?address=${addr}`);
  const j = await r.json();

  const comSaldo = j.chains.filter(c=>c.has);
  
  if(comSaldo.length===0){
    out.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">Essa carteira <span class="font-mono text-xs">${addr.slice(0,10)}...</span> não tem saldo nativo em nenhuma das 8 chains verificadas.<br><span class="text-xs text-zinc-500">Ela existe em todas, mas está vazia.</span></div>`;
    return;
  }

  out.innerHTML = `<div class="mb-3 text-green-400 font-bold">✅ Carteira encontrada em ${comSaldo.length} blockchain(s):</div>` + 
  comSaldo.map(c=>{
    const eth = (Number(BigInt(c.hex))/1e18).toFixed(6);
    return `<div class="bg-zinc-900 border border-green-900/50 p-4 rounded-xl mb-2 flex justify-between items-center">
      <div><div class="font-bold">${NAMES[c.chain]} - ${c.chain}</div><div class="text-xs text-zinc-500">Saldo: ${eth} ${c.chain=='56'?'BNB':c.chain=='137'?'MATIC':c.chain=='43114'?'AVAX':'ETH'}</div></div>
      <div class="text- bg-green-600 px-3 py-1 rounded-full">TEM SALDO</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
