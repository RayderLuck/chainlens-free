<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens - multichain auto (NodeReal)</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">cole o contrato • detecta via NodeReal em todas as chains • 100% RAW sem Etherscan</p>
      </div>
      <div id="price" class="text-right text-xs"><div class="text-zinc-500">BNB</div><div id="bnbPrice" class="font-bold animate-pulse">...</div></div>
    </div>

    <div class="mt-6 flex gap-2">
      <input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm outline-none focus:border-white" placeholder="0x... cole o contrato" value="0x55d398326f99059fF775485246999027B319F875">
      <button id="btn" onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold hover:bg-zinc-200 disabled:opacity-50">Rastrear em todas as chains</button>
    </div>

    <div id="status" class="mt-4 hidden text-xs text-zinc-500"></div>
    <div id="chains" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    <div id="result" class="mt-6"></div>
    <div id="debug" class="mt-6 text- text-zinc-600 font-mono whitespace-pre-wrap break-all"></div>
  </div>

<script type="module">
const CHAINS = [
  { id:'1', name:'Ethereum', symbol:'ETH', explorer:'https://etherscan.io', color:'text-blue-400' },
  { id:'56', name:'BSC', symbol:'BNB', explorer:'https://bscscan.com', color:'text-yellow-400' },
  { id:'137', name:'Polygon', symbol:'MATIC', explorer:'https://polygonscan.com', color:'text-purple-400' },
  { id:'8453', name:'Base', symbol:'ETH', explorer:'https://basescan.org', color:'text-blue-300' },
  { id:'42161', name:'Arbitrum', symbol:'ETH', explorer:'https://arbiscan.io', color:'text-cyan-400' },
  { id:'10', name:'Optimism', symbol:'ETH', explorer:'https://optimistic.etherscan.io', color:'text-red-400' },
  { id:'43114', name:'Avalanche', symbol:'AVAX', explorer:'https://snowtrace.io', color:'text-red-300' },
  { id:'59144', name:'Linea', symbol:'ETH', explorer:'https://lineascan.build', color:'text-zinc-300' },
];

async function nodeRealCall(address, chain){
  const url = `/api/tokeninfo?address=${address}&chain=${chain}&action=tokeninfo`;
  const r = await fetch(url);
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch { throw new Error(text.slice(0,300)); }
  return j;
}
async function rpcCall(chainId, method, params){
  const r = await fetch(`/api/rpc?chain=${chainId}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({jsonrpc:'2.0', id:1, method, params}) });
  return r.json();
}

window.check = async () => {
  const addr = document.getElementById('addr').value.trim();
  const status = document.getElementById('status');
  const chainsEl = document.getElementById('chains');
  const resultEl = document.getElementById('result');
  const debugEl = document.getElementById('debug');
  const btn = document.getElementById('btn');
  if(!addr.startsWith('0x') || addr.length!==42) return alert('Endereço inválido');
  btn.disabled=true;
  status.classList.remove('hidden');
  status.innerHTML=`🔍 Varrendo ${CHAINS.length} chains via NodeReal...`;
  chainsEl.innerHTML=CHAINS.map(c=>`<div class="bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl animate-pulse"><div class="text-xs text-zinc-500">${c.name}</div><div class="text-sm">Verificando...</div></div>`).join('');
  resultEl.innerHTML=''; debugEl.textContent='';

  const settled = await Promise.all(CHAINS.map(async (chain,i)=>{
    await new Promise(r=>setTimeout(r,i*250));
    try{
      const info = await nodeRealCall(addr, chain.id);
      if(info.status==='1' && info.result?.length>0) return {chain, found:true, data:info.result[0]};
      return {chain, found:false, reason:info.result||info.message};
    }catch(e){ return {chain, found:false, reason:e.message}; }
  }));

  chainsEl.innerHTML = settled.map(r=>{
    if(r.found){
      const d=r.data;
      return `<div class="bg-zinc-900 border border-green-900/50 rounded-xl p-4"><div class="font-bold ${r.chain.color}">${r.chain.name} • ENCONTRADO ✅</div><div class="mt-1 text-sm font-bold">${d.tokenName} (${d.symbol})</div><div class="text-xs text-zinc-500">Decimals: ${d.decimals} • <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-violet-400">[RAW]</a></div><a href="${r.chain.explorer}/address/${addr}" target="_blank" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold mt-3 inline-block">Explorer ↗</a></div>`;
    }else{
      return `<div class="bg-zinc-900/30 border border-zinc-800 border-dashed p-3 rounded-xl opacity-60"><div class="text-xs text-zinc-500">${r.chain.name} • não encontrado</div></div>`;
    }
  }).join('');

  const found = settled.filter(r=>r.found);
  status.innerHTML=`✅ Encontrado em <b>${found.length}</b> de ${CHAINS.length} chains via NodeReal`;
  if(found.length===0) debugEl.textContent=`DEBUG: ${JSON.stringify(settled[0],null,2)}`;
  else showDetails(found[0].chain.id, addr);
  btn.disabled=false;
};

window.showDetails = async (chainId, addr) => {
  const resultEl=document.getElementById('result');
  const chain=CHAINS.find(c=>c.id===chainId);
  resultEl.innerHTML=`<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 animate-pulse">Lendo ${chain.name} via NodeReal...</div>`;
  const code = await rpcCall(chainId,'eth_getCode',[addr,'latest']);
  const size = code?.result? (code.result.length-2)/2 : 0;
  resultEl.innerHTML=`<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5"><div class="font-bold">Detalhes ${chain.name} - ${size} bytes de código</div><a href="${chain.explorer}/address/${addr}" target="_blank" class="text-xs bg-white text-black px-3 py-1.5 rounded-full mt-3 inline-block">Explorer ↗</a></div>`;
};

setTimeout(check,800);
</script>
</body>
</html>
