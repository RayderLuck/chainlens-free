<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens - multichain auto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">cole o contrato • detecta automaticamente em todas as chains • 100% RAW verificável</p>
      </div>
      <div id="price" class="text-right text-xs"><div class="text-zinc-500">BNB</div><div class="font-bold animate-pulse">...</div></div>
    </div>

    <div class="mt-6 flex gap-2">
      <input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm outline-none focus:border-white" placeholder="0x... cole o contrato ou carteira" value="0x55d398326f99059fF775485246999027B319F875">
      <button onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold hover:bg-zinc-200">Rastrear em todas as chains</button>
    </div>

    <div id="status" class="mt-4 hidden text-xs text-zinc-500"></div>
    <div id="chains" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    <div id="result" class="mt-6"></div>
  </div>

<script type="module">
const CHAINS = [
  { id:'1', name:'Ethereum', symbol:'ETH', explorer:'https://etherscan.io', color:'text-blue-400' },
  { id:'56', name:'BSC', symbol:'BNB', explorer:'https://bscscan.com', color:'text-yellow-400' },
  { id:'137', name:'Polygon', symbol:'MATIC', explorer:'https://polygonscan.com', color:'text-purple-400' },
  { id:'8453', name:'Base', symbol:'ETH', explorer:'https://basescan.org', color:'text-blue-300' },
  { id:'42161', name:'Arbitrum', symbol:'ETH', explorer:'https://arbiscan.io', color:'text-cyan-400' },
  { id:'10', name:'Optimism', symbol:'ETH', explorer:'https://optimistic.etherscan.io', color:'text-red-400' },
  { id:'43114', name:'Avalanche', symbol:'AVAX', explorer:'https://snowtrace.io', color:'text-red-300' },
  { id:'59144', name:'Linea', symbol:'ETH', explorer:'https://lineascan.build', color:'text-zinc-300' },
];

async function v2Call(address, chain, action){
  const r = await fetch(`/api/tokeninfo?address=${address}&chain=${chain}&action=${action}`);
  const j = await r.json();
  return j;
}

async function rpcCall(chainId, method, params){
  // Usa BSC RPC pra tudo por enquanto - saldo nativo só faz sentido na chain principal, mas tokeninfo já cobre multichain
  const r = await fetch('/api/rpc', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({jsonrpc:'2.0', id:1, method, params}) });
  return r.json();
}

window.check = async () => {
  const addr = document.getElementById('addr').value.trim();
  const status = document.getElementById('status');
  const chainsEl = document.getElementById('chains');
  const resultEl = document.getElementById('result');
  
  if(!addr || !addr.startsWith('0x')) return alert('Endereço inválido');
  
  status.classList.remove('hidden');
  status.innerHTML = `🔍 Varrendo ${CHAINS.length} chains via Etherscan V2... isso leva 3s`;
  chainsEl.innerHTML = CHAINS.map(c=>`<div class="bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl animate-pulse"><div class="text-xs text-zinc-500">${c.name}</div><div class="text-sm">Verificando...</div></div>`).join('');
  resultEl.innerHTML = '';

  const results = [];
  
  // Faz todas as chamadas em paralelo com delay pra não tomar rate limit
  const promises = CHAINS.map(async (chain, i) => {
    await new Promise(r=> setTimeout(r, i*250)); // 250ms entre cada pra não floodar
    try{
      const info = await v2Call(addr, chain.id, 'tokeninfo');
      // Etherscan V2 retorna result array mesmo se não achar? Checa status
      const found = info && (info.status==='1' || (Array.isArray(info.result) && info.result.length>0 && info.result[0].contractAddress));
      if(found){
        const t = Array.isArray(info.result) ? info.result[0] : info.result;
        return { chain, found:true, data:t, raw:info };
      } else {
        return { chain, found:false, raw:info };
      }
    }catch(e){
      return { chain, found:false, error:e.message };
    }
  });

  const settled = await Promise.all(promises);
  
  // Renderiza resultado multichain
  chainsEl.innerHTML = settled.map(r=>{
    if(r.found){
      const d = r.data;
      return `
        <div class="bg-zinc-900 border border-green-900/50 rounded-xl p-4 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
          <div class="flex justify-between">
            <div class="font-bold ${r.chain.color}">${r.chain.name} (${r.chain.id}) • ENCONTRADO ✅</div>
            <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-xs text-violet-400 hover:underline">[RAW]</a>
          </div>
          <div class="mt-2 text-sm font-bold">${d.tokenName || d.name || 'Token'} (${d.symbol || d.tokenSymbol || '?'})</div>
          <div class="text-xs text-zinc-400 mt-1">Holders: ${d.holderCount || '?'} • Decimals: ${d.divisor? Math.log10(d.divisor) : d.decimals || '?'} • TotalSupply: ${d.totalSupply? (Number(d.totalSupply)/10**18).toLocaleString('pt-BR').slice(0,20)+'...' : '?'}</div>
          <div class="mt-3 flex gap-2">
            <a href="${r.chain.explorer}/address/${addr}" target="_blank" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">Explorer ↗</a>
            <button onclick="document.getElementById('addr').value='${addr}'; showDetails('${r.chain.id}','${addr}')" class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full">ver detalhes</button>
          </div>
        </div>`;
    } else {
      return `
        <div class="bg-zinc-900/30 border border-zinc-800 border-dashed p-3 rounded-xl opacity-60">
          <div class="flex justify-between">
            <div class="text-xs text-zinc-500">${r.chain.name} (${r.chain.id}) • não encontrado</div>
            <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-xs text-zinc-600">[RAW]</a>
          </div>
        </div>`;
    }
  }).join('');

  const foundChains = settled.filter(r=>r.found);
  status.innerHTML = `✅ Varredura completa: encontrado em <b>${foundChains.length}</b> de ${CHAINS.length} chains • 100% verificável via [RAW]`;
  
  if(foundChains.length===0){
    resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 text-sm text-zinc-400">Esse endereço não é um token verificado nas 8 chains principais via Etherscan V2. Pode ser uma carteira comum ou token não verificado. Tenta com USDT 0x55d398326f99059fF775485246999027B319F875 que você vai ver funcionando em 5 chains.</div>`;
  } else {
    // Mostra detalhe da primeira encontrada automaticamente
    showDetails(foundChains[0].chain.id, addr);
  }
}

window.showDetails = async (chainId, addr) => {
  const resultEl = document.getElementById('result');
  const chain = CHAINS.find(c=>c.id===chainId);
  resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 animate-pulse">Carregando transações de ${chain.name}...</div>`;
  try{
    const txsData = await v2Call(addr, chainId, 'tokentx');
    const txs = txsData.result && Array.isArray(txsData.result) ? txsData.result.slice(0,10) : [];
    if(txs.length>0){
      const html = txs.map(t=>{
        const val = Number(t.value)/10**(Number(t.tokenDecimal||18));
        return `<div class="flex justify-between py-2 border-b border-zinc-800/50 text-sm"><span class="text-xs text-zinc-500">${new Date(Number(t.timeStamp)*1000).toLocaleDateString('pt-BR')} • ${t.from.slice(0,6)}... -> ${t.to.slice(0,6)}...</span><span class="font-bold">${val.toFixed(2)} ${t.tokenSymbol}</span></div>`;
      }).join('');
      resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5"><div class="font-bold mb-2">Últimas transferências em ${chain.name} <a href="/api/tokeninfo?address=${addr}&chain=${chainId}&action=tokentx" target="_blank" class="text-violet-400 text-xs">[RAW]</a></div>${html}</div>`;
    } else {
      resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-500">Sem histórico tokentx recente nessa chain, mas token existe e está verificado. <a href="/api/tokeninfo?address=${addr}&chain=${chainId}&action=tokentx" target="_blank" class="text-violet-400">[RAW]</a></div>`;
    }
  }catch(e){ resultEl.innerHTML = `<div class="text-sm text-red-300">${e.message}</div>`; }
}

// auto
setTimeout(check, 800);
</script>
</body>
</html>
