<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAINLENS — Praça Explorer v0.3</title>
  <meta name="description" content="Scanner eth_getCode em 8 chains. Sem API key exposta, verificação real, praça aberta. 100% open-source, MIT, sem token.">
  <meta property="og:title" content="CHAINLENS — Onde tá esse endereço?">
  <meta property="og:description" content="Verifica se é wallet ou contrato em 8 chains via eth_getCode cru. Sem login, sem rastreio.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#00FF88">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300FF88'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='700' font-size='60' fill='black'>_</text></svg>">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
  *{font-family:'Space Grotesk',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  .glass{backdrop-filter: blur(16px); background: rgba(10,20,10,0.6);}
  .glow{box-shadow: 0 0 100px rgba(34,197,94,0.2), inset 0 1px 0 rgba(34,197,94,0.1);}
  .grid-bg{background-image: linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px); background-size: 40px 40px;}
  body{margin:0;background:#000;color:#fff;min-height:100vh}
  #root{min-height:100%}
  </style>
  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b2108e248dd843729b9ec1f2c00e0f8a"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body class="bg-black text-white min-h-screen grid-bg selection:bg-[#00FF88] selection:text-black">
  <div id="root"></div>
  <script type="module">
  // CHAINLENS v0.3 - Professional Build - Cloudflare Analytics Enabled
  const CHAINS = {
    "1":["ETHEREUM","ETH"], "56":["BSC","BNB"], "137":["POLYGON","MATIC"],
    "8453":["BASE","ETH"], "42161":["ARBITRUM","ETH"], "10":["OPTIMISM","ETH"],
    "43114":["AVALANCHE","AVAX"], "59144":["LINEA","ETH"]
  };
  const EXPLORERS = {
    "1":"https://etherscan.io/address/", "56":"https://bscscan.com/address/",
    "137":"https://polygonscan.com/address/", "8453":"https://basescan.org/address/",
    "42161":"https://arbiscan.io/address/", "10":"https://optimistic.etherscan.io/address/",
    "43114":"https://snowtrace.io/address/", "59144":"https://lineascan.build/address/"
  };
  async function doScan(){
    const a=document.getElementById('a'), out=document.getElementById('out'), btn=document.getElementById('btn');
    const addr=a?.value.trim()??'';
    if(!out||!btn) return;
    if(!addr.startsWith('0x')||addr.length!=42){
      out.innerHTML='<div style="border:1px solid #7f1d1d;background:rgba(127,29,29,.1);padding:16px;border-radius:12px;font-family:monospace;font-size:12px;color:#f87171">> ERRO: ENDEREÇO INVÁLIDO [0x + 40 HEX]</div>';return;
    }
    btn.textContent='SCANNING...'; btn.disabled=true;
    out.innerHTML=`<div style="border:1px solid rgba(0,255,136,.2);backdrop-filter:blur(16px);background:rgba(10,20,10,.6);border-radius:12px;padding:24px;font-family:monospace;font-size:12px"><div style="display:flex;gap:8px;color:#00FF88"><div style="width:12px;height:12px;border:1px solid #00FF88;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div> varrendo 8 chains_</div><div style="margin-top:12px;color:#52525b">> eth_getCode(${addr.slice(0,10)}...) em eth-mainnet, bsc-mainnet, polygon-mainnet...</div></div>`;
    try{
      const res=await fetch(`/api/scan?address=${addr}`);
      if(!res.ok) throw new Error('API /api/scan offline - crie a Pages Function');
      const data=await res.json();
      const contracts=data.filter(x=>x.exists);
      if(contracts.length==0){
        out.innerHTML=`<div style="border:1px solid rgba(0,255,136,.3);background:rgba(0,255,136,.05);border-radius:12px;padding:20px;font-family:monospace"><div style="color:#00FF88;font-size:14px">> TIPO: WALLET / EOA</div><div style="color:#a1a1aa;font-size:12px;margin-top:4px">Endereço ${addr.slice(0,10)}... não tem bytecode. É carteira e existe em todas as chains.</div></div>`+
        data.map(p=>`<div style="border:1px solid #27272a;display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:12px;margin-top:8px;font-family:monospace;font-size:12px"><div><span style="color:#fff">${CHAINS[p.id][0]}</span> <span style="color:#52525b">[${p.id}]</span></div><a href="${EXPLORERS[p.id]}${addr}" target="_blank" style="background:#18181b;border:1px solid #27272a;padding:6px 12px;border-radius:9999px;font-size:11px">EXPLORAR_CARTEIRA ↗</a></div>`).join('');
      }else{
        out.innerHTML=`<div style="border:1px solid rgba(0,255,136,.3);background:rgba(0,255,136,.1);border-radius:12px;padding:16px;font-family:monospace;display:flex;justify-content:space-between"><span style="color:#00FF88;font-size:12px">> TIPO: CONTRACT • ${contracts.length} CHAIN(S)</span><span style="color:#71717a;font-size:10px">${addr.slice(0,6)}...${addr.slice(-4)}</span></div>`+
        contracts.map(p=>`<div style="border:1px solid rgba(0,255,136,.2);background:rgba(10,20,10,.6);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:monospace"><div><div style="font-size:14px;font-weight:700;color:#fff">${CHAINS[p.id][0]} <span style="color:#00FF88">[${p.id}]</span></div><div style="font-size:10px;color:#71717a">${p.len} BYTES • ${CHAINS[p.id][1]} NETWORK</div></div><a href="${EXPLORERS[p.id]}${addr}" target="_blank" style="background:#00FF88;color:#000;padding:8px 16px;border-radius:9999px;font-weight:700;font-size:11px">VER_CONTRATO ↗</a></div>`).join('');
      }
    }catch(e){ out.innerHTML=`<div style="font-family:monospace;font-size:12px;color:#f87171">> ERRO: ${e.message}</div>` }
    finally{ btn.textContent='SCAN'; btn.disabled=false }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('root').innerHTML=`
    <div style="max-width:672px;margin:0 auto;padding:40px 24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:40px">
        <div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;border-radius:6px;background:#00FF88;color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:monospace">_</div><div style="font-family:monospace;font-size:14px;letter-spacing:.1em">CHAINLENS<span style="color:#00FF88">_EXPLORER</span></div></div>
        <div style="font-family:monospace;font-size:10px;color:#71717a;border:1px solid #27272a;padding:4px 8px;border-radius:6px">v0.4 • PRO • ANALYTICS ON</div>
      </div>
      <div style="margin-bottom:32px"><h1 style="font-size:48px;font-weight:700;letter-spacing:-.05em;line-height:.9;margin:0">ONDE TÁ<br><span style="color:#00FF88">ESSE ENDEREÇO?</span></h1><p style="font-family:monospace;font-size:12px;color:#71717a;margin-top:12px">> scan eth_getCode em 8 chains via NodeReal • sem api key exposta • Cloudflare Analytics ativo</p></div>
      <div style="backdrop-filter:blur(16px);background:rgba(10,20,10,.6);box-shadow:0 0 100px rgba(34,197,94,.2);border:1px solid rgba(0,255,136,.2);border-radius:12px;padding:8px;display:flex;gap:8px">
        <span style="font-family:monospace;color:#00FF88;padding-left:16px;align-self:center">></span>
        <input id="a" placeholder="0x..." spellcheck="false" style="flex:1;background:transparent;outline:none;padding:12px 0;font-family:monospace;font-size:14px;color:#fff;border:none" onkeydown="if(event.key==='Enter'){window.doScan()}">
        <button id="btn" onclick="window.doScan()" style="background:#00FF88;color:#000;font-weight:700;padding:0 24px;border-radius:12px;font-family:monospace;font-size:12px;letter-spacing:.1em;border:none;cursor:pointer">SCAN</button>
      </div>
      <div id="out" style="margin-top:32px;display:flex;flex-direction:column;gap:8px"></div>
      <div style="margin-top:80px;border-top:1px solid #18181b;padding-top:32px;font-family:monospace;font-size:10px;color:#3f3f46">CHAINLENS v0.4 PRO • Analytics token b2108e24... • feito na rua, não no pitch • github.com/praca/chainlens</div>
    </div>`;
    window.doScan=doScan;
  });
  </script>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
