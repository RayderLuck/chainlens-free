<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens - multichain auto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">cole o contrato • detecta automaticamente em todas as chains • 100% RAW verificável</p>
      </div>
      <div id="price" class="text-right text-xs"><div class="text-zinc-500">BNB</div><div id="bnbPrice" class="font-bold">...</div></div>
    </div>

    <div class="mt-6 flex gap-2">
      <input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm outline-none focus:border-white" placeholder="0x... cole o contrato" value="0x55d398326f99059fF775485246999027B319F875">
      <button id="btn" onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold hover:bg-zinc-200 disabled:opacity-50">Rastrear em todas as chains</button>
    </div>

    <div id="status" class="mt-4 hidden text-xs text-zinc-500"></div>
    <div id="chains" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    <div id="result" class="mt-6"></div>
    <div id="debug" class="mt-6 text-[10px] text-zinc-600 font-mono whitespace-pre-wrap break-all"></div>
  </div>

<script type="module">
const CHAINS = [
  { id:'1', name:'Ethereum', symbol:'ETH', explorer:'https://etherscan.io', color:'text-blue-400' },
  { id:'56', name:'BSC', symbol:'BNB', explorer:'https://bscscan.com', color:'text-yellow-400' },
  { id:'137', name:'Polygon', symbol:'MATIC', explorer:'https://polygonscan.com', color:'text-purple-400' },
  { id:'8453', name:'Base', symbol:'ETH', explorer:'https://basescan.org', color:'text-blue-300' },
  { id:'42161', name:'Arbitrum', symbol:'ETH', explorer:'https://arbiscan.io', color:'text-cyan-400' },
  { id:'10', name:'Optimism', symbol:'ETH', explorer:'https://optimistic.etherscan.io', color:'text-red-400' },
  { id:'43114', name:'Avalanche', symbol:'AVAX', explorer:'https://snowtrace.io', color:'text-red-300' },
  { id:'59144', name:'Linea', symbol:'ETH', explorer:'https://lineascan.build', color:'text-zinc-300' },
];

async function v2Call(address, chain, action){
  const url = `/api/tokeninfo?address=${address}&chain=${chain}&action=${action}`;
  const r = await fetch(url);
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch { throw new Error(`Resposta não JSON de ${url}: ${text.slice(0,200)}`); }
  if(!r.ok){
    throw new Error(`HTTP ${r.status}: ${JSON.stringify(j).slice(0,300)}`);
  }
  return j;
}

async function loadBnbPrice(){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd');
    const j = await r.json();
    document.getElementById('bnbPrice').textContent = `$${j.binancecoin.usd}`;
  }catch{ document.getElementById('bnbPrice').textContent = '---' }
}

window.check = async () => {
  const addr = document.getElementById('addr').value.trim();
  const status = document.getElementById('status');
  const chainsEl = document.getElementById('chains');
  const resultEl = document.getElementById('result');
  const debugEl = document.getElementById('debug');
  const btn = document.getElementById('btn');
  
  if(!addr || !addr.startsWith('0x') || addr.length !== 42) return alert('Endereço inválido, tem que ser 0x + 40 chars');
  
  btn.disabled = true;
  status.classList.remove('hidden');
  status.innerHTML = `🔍 Varrendo ${CHAINS.length} chains via Etherscan V2 (proxy /api)...`;
  chainsEl.innerHTML = CHAINS.map(c=>`<div class="bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl animate-pulse"><div class="text-xs text-zinc-500">${c.name}</div><div class="text-sm">Verificando...</div></div>`).join('');
  resultEl.innerHTML = '';
  debugEl.textContent = '';

  const promises = CHAINS.map(async (chain, i) => {
    await new Promise(r=> setTimeout(r, i*300));
    try{
      const info = await v2Call(addr, chain.id, 'tokeninfo');
      const hasResult = info && info.status === '1' && Array.isArray(info.result) && info.result.length > 0;
      if(hasResult){
        const t = info.result[0];
        return { chain, found:true, data:t, raw:info };
      } else {
        return { chain, found:false, raw:info, reason: `${info.message||''} - ${JSON.stringify(info.result||'').slice(0,100)}` };
      }
    }catch(e){
      return { chain, found:false, error:e.message, reason:e.message };
    }
  });

  const settled = await Promise.all(promises);
  
  chainsEl.innerHTML = settled.map(r=>{
    if(r.found){
      const d = r.data;
      const supply = d.totalSupply ? (Number(d.totalSupply)/10**(Number(d.decimals||18))).toLocaleString('pt-BR') : '?';
      return `
        <div class="bg-zinc-900 border border-green-900/50 rounded-xl p-4 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
          <div class="flex justify-between">
            <div class="font-bold ${r.chain.color}">${r.chain.name} (${r.chain.id}) • ENCONTRADO ✅</div>
            <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-xs text-violet-400 hover:underline">[RAW]</a>
          </div>
          <div class="mt-2 text-sm font-bold">${d.tokenName || d.name || 'Token'} (${d.symbol || d.tokenSymbol || '?'})</div>
          <div class="text-xs text-zinc-400 mt-1">Decimals: ${d.decimals || (d.divisor? Math.log10(d.divisor): '?')} • Supply: ${supply.slice(0,30)}</div>
          <div class="mt-3 flex gap-2">
            <a href="${r.chain.explorer}/address/${addr}" target="_blank" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">Explorer ↗</a>
            <button onclick="showDetails('${r.chain.id}','${addr}')" class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full">ver txs</button>
          </div>
        </div>`;
    } else {
      return `
        <div class="bg-zinc-900/30 border border-zinc-800 border-dashed p-3 rounded-xl opacity-60">
          <div class="flex justify-between">
            <div class="text-xs text-zinc-500">${r.chain.name} (${r.chain.id}) • não encontrado <span class="text-[9px] text-zinc-600 ml-1">${(r.reason||'').slice(0,70)}</span></div>
            <a href="/api/tokeninfo?address=${addr}&chain=${r.chain.id}&action=tokeninfo" target="_blank" class="text-xs text-zinc-600">[RAW]</a>
          </div>
        </div>`;
    }
  }).join('');

  const foundChains = settled.filter(r=>r.found);
  status.innerHTML = `✅ Varredura completa: encontrado em <b>${foundChains.length}</b> de ${CHAINS.length} chains • 100% verificável via [RAW]`;
  
  if(foundChains.length===0){
    const firstError = settled[0]?.raw || settled[0]?.error;
    debugEl.textContent = `DEBUG primeiro erro RAW: ${JSON.stringify(firstError, null, 2)}`;
    resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 text-sm text-zinc-400">Nenhum token encontrado. Se o DEBUG abaixo mostrar "API KEY NÃO ENCONTRADA", sua variável Segredo ETHERSCAN_V2_KEY não está em Production. Se mostrar "Invalid API Key", a key da Etherscan está errada.</div>`;
  } else {
    showDetails(foundChains[0].chain.id, addr);
  }
  btn.disabled = false;
}

window.showDetails = async (chainId, addr) => {
  const resultEl = document.getElementById('result');
  const chain = CHAINS.find(c=>c.id===chainId);
  resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 animate-pulse">Carregando transferências de ${chain.name}...</div>`;
  try{
    const txsData = await v2Call(addr, chainId, 'tokentx');
    const txs = txsData.result && Array.isArray(txsData.result) ? txsData.result.slice(0,10) : [];
    if(txs.length>0){
      const html = txs.map(t=>{
        const dec = Number(t.tokenDecimal||18);
        const val = Number(t.value)/10**dec;
        const date = new Date(Number(t.timeStamp)*1000).toLocaleDateString('pt-BR');
        return `<div class="flex justify-between py-2 border-b border-zinc-800/50 text-sm"><span class="text-xs text-zinc-500">${date} • ${t.from.slice(0,6)}... -> ${t.to.slice(0,6)}...</span><span class="font-bold">${val.toLocaleString('pt-BR')} ${t.tokenSymbol}</span></div>`;
      }).join('');
      resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5"><div class="font-bold mb-2">Últimas transferências em ${chain.name} <a href="/api/tokeninfo?address=${addr}&chain=${chainId}&action=tokentx" target="_blank" class="text-violet-400 text-xs">[RAW]</a></div>${html}</div>`;
    } else {
      resultEl.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-500">Sem histórico tokentx recente, mas token existe. <a href="/api/tokeninfo?address=${addr}&chain=${chainId}&action=tokentx" target="_blank" class="text-violet-400">[RAW]</a> Resposta: ${JSON.stringify(txsData).slice(0,400)}</div>`;
    }
  }catch(e){ resultEl.innerHTML = `<div class="text-sm text-red-300">Erro: ${e.message}</div>`; }
}

loadBnbPrice();
setTimeout(check, 800);
</script>
</body>
</html>
