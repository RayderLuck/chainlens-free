<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens-free - útil</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">seu radar de baleias BNB • útil e grátis</p>
      </div>
      <div id="price" class="text-right"><div class="text-xs text-zinc-500">BNB</div><div class="font-bold">--</div></div>
    </div>

    <div class="mt-6 flex gap-2">
      <input id="addr" class="flex-1 p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm" placeholder="0x... cole a carteira aqui" value="0x8894E0a0c962CB723c1976a4421c95949bE2D4E3">
      <button onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold">Rastrear</button>
      <button onclick="saveWhale()" class="px-4 py-3 bg-zinc-800 rounded-xl">⭐</button>
    </div>

    <div id="result" class="mt-6 hidden"></div>
    <div id="txs" class="mt-4 hidden"></div>

    <div class="mt-8">
      <div class="flex justify-between items-center mb-3"><h2 class="font-bold">📋 Minhas baleias salvas</h2><button onclick="clearAll()" class="text-xs text-zinc-500">limpar</button></div>
      <div id="watchlist" class="grid gap-2"></div>
    </div>
  </div>

<script type="module">
  const KEY = import.meta.env.VITE_NODEREAL_KEY;
  const RPC = `https://bsc-mainnet.nodereal.io/v1/${KEY}`;
  let bnbPrice = 0;

  async function getPrice(){
    try{
      const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd');
      bnbPrice = (await r.json()).binancecoin.usd;
      document.getElementById('price').innerHTML = `<div class="text-xs text-zinc-500">BNB</div><div class="font-bold">$${bnbPrice}</div>`;
    }catch{ bnbPrice = 600; }
  }
  getPrice(); setInterval(getPrice, 60000);

  async function rpcCall(m,p){
    const r = await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p})});
    const j = await r.json(); if(j.error) throw new Error(j.error.message); return j.result;
  }

  function getWatchlist(){ try{ return JSON.parse(localStorage.getItem('chainlens_watch')||'[]'); }catch{ return []; } }
  function renderWatchlist(){
    const list = getWatchlist();
    document.getElementById('watchlist').innerHTML = list.length ? list.map(w=>`
      <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-xl border border-zinc-800">
        <div class="font-mono text-xs truncate">${w.addr}</div>
        <div class="flex gap-2 items-center">
          <span class="text-xs ${w.bnb>=10000?'text-purple-400':'text-green-400'}">${w.bnb.toFixed(1)} BNB</span>
          <button onclick="document.getElementById('addr').value='${w.addr}';check()" class="text-xs bg-white text-black px-2 py-1 rounded">ver</button>
        </div>
      </div>`).join('') : '<div class="text-zinc-600 text-sm">Nenhuma baleia salva. Rastreie e clique na ⭐</div>';
  }
  renderWatchlist();

  window.saveWhale = () => {
    const addr = document.getElementById('addr').value.trim(); const bnb = parseFloat(document.getElementById('addr').dataset.bnb||'0');
    if(!addr) return; const list = getWatchlist();
    if(list.find(x=>x.addr.toLowerCase()===addr.toLowerCase())) return alert('Já salva!');
    list.unshift({addr, bnb, at: Date.now()}); localStorage.setItem('chainlens_watch', JSON.stringify(list.slice(0,20))); renderWatchlist();
  }
  window.clearAll = () => { if(confirm('Limpar tudo?')){ localStorage.removeItem('chainlens_watch'); renderWatchlist(); } }

  window.check = async () => {
    const addr = document.getElementById('addr').value.trim();
    const res = document.getElementById('result'); const txsDiv = document.getElementById('txs');
    if(!addr) return; res.classList.remove('hidden'); res.innerHTML = '🔍 Buscando na BNB Chain...'; txsDiv.classList.add('hidden');
    try{
      const [balHex, txCountHex] = await Promise.all([rpcCall('eth_getBalance',[addr,'latest']), rpcCall('eth_getTransactionCount',[addr,'latest'])]);
      const bnb = parseInt(balHex,16)/1e18; const txCount = parseInt(txCountHex,16);
      document.getElementById('addr').dataset.bnb = bnb;
      const usd = bnb*bnbPrice; const isWhale = bnb>=100; const isTop = bnb>=10000;
      const score = bnb>=50000? '🔥 LENDÁRIA' : bnb>=10000? '👑 TOP' : bnb>=1000? '🐋 GRANDE' : bnb>=100? '🐋 BALEIA' : '🐟 PEIXE';
      
      res.innerHTML = `
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
          <div class="flex justify-between"><span class="text-xs text-zinc-500">CARTEIRA • ${txCount} txs</span><span class="text-xs px-2 py-1 rounded-full ${isTop?'bg-purple-900 text-purple-200':isWhale?'bg-green-900 text-green-200':'bg-zinc-800'}">${score}</span></div>
          <div class="font-mono text-xs mt-2 break-all text-zinc-400">${addr}</div>
          <div class="grid grid-cols-2 gap-4 mt-4">
            <div class="bg-black p-4 rounded-xl"><div class="text-xs text-zinc-500">SALDO</div><div class="text-2xl font-bold">${bnb.toLocaleString('pt-BR',{maximumFractionDigits:2})} BNB</div><div class="text-sm text-zinc-400">$${usd.toLocaleString('en-US',{maximumFractionDigits:0})}</div></div>
            <div class="bg-black p-4 rounded-xl"><div class="text-xs text-zinc-500">STATUS</div><div class="text-lg font-bold mt-1">${isTop?'💎 Holder diamante<br>10k+ BNB':isWhale?'Baleia ativa':'Trader comum'}</div></div>
          </div>
          <div class="mt-4 flex gap-2">
            <a href="https://bscscan.com/address/${addr}" target="_blank" class="flex-1 text-center text-sm bg-zinc-800 py-2.5 rounded-xl hover:bg-zinc-700">BscScan ↗</a>
            <a href="https://debank.com/profile/${addr}" target="_blank" class="flex-1 text-center text-sm bg-zinc-800 py-2.5 rounded-xl hover:bg-zinc-700">DeBank ↗</a>
            <button onclick="navigator.clipboard.writeText('${addr}')" class="text-sm bg-white text-black px-4 py-2.5 rounded-xl font-bold">Copiar</button>
          </div>
          <div class="mt-3 text- text-zinc-600">NodeReal: Conectado ✅ • Preço atualizado a cada 1min</div>
        </div>`;

      // Transações
      const txUrl = `https://api.bscscan.com/api?module=account&action=txlist&address=${addr}&page=1&offset=8&sort=desc`;
      const tr = await fetch(txUrl).then(r=>r.json());
      const txs = tr.result||[];
      if(txs.length){
        txsDiv.classList.remove('hidden');
        txsDiv.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
          <div class="font-bold mb-3">⚡ Últimas movimentações úteis</div>
          ${txs.map(t=>{
            const val = parseInt(t.value)/1e18; if(val===0) return '';
            const isOut = t.from.toLowerCase()===addr.toLowerCase();
            return `<div class="flex justify-between items-center py-2.5 border-b border-zinc-800/50 last:border-0 text-sm">
              <div class="flex items-center gap-2"><span class="${isOut?'bg-red-900/50 text-red-300':'bg-green-900/50 text-green-300'} px-2 py-1 rounded text-xs font-bold">${isOut?'SAIU':'ENTROU'}</span><span class="font-mono text-xs text-zinc-500">${new Date(t.timeStamp*1000).toLocaleDateString('pt-BR')}</span></div>
              <div class="font-bold">${val.toFixed(3)} BNB <span class="text-xs text-zinc-500">$${(val*bnbPrice).toFixed(0)}</span></div>
            </div>`;
          }).join('')}
        </div>`;
      }
    }catch(e){ res.innerHTML = `<div class="bg-red-900/30 border border-red-800 p-4 rounded-xl text-red-300">Erro: ${e.message}</div>`; }
  }
  // auto check ao abrir
  setTimeout(check, 500);
</script>
</body>
</html>
