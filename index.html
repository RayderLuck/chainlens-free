<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chainlens - radar transparente</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">🔭 chainlens</h1>
        <p class="text-zinc-500 text-sm">radar transparente • dados on-chain verificáveis • sem cartão</p>
      </div>
      <div id="price" class="text-right"><div class="text-xs text-zinc-500">BNB</div><div class="font-bold animate-pulse">...</div></div>
    </div>

    <div class="mt-6 flex gap-2 flex-wrap">
      <input id="addr" class="flex-1 min-w-[240px] p-3 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-sm outline-none focus:border-white" placeholder="0x... carteira ou contrato" value="0x8894E0a0c962CB723c1976a4421c95949bE2D4E3">
      <select id="chain" class="p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-sm">
        <option value="56">BSC 56</option>
        <option value="1">ETH 1</option>
        <option value="137">Polygon 137</option>
        <option value="8453">Base 8453</option>
        <option value="42161">Arbitrum 42161</option>
      </select>
      <button onclick="check()" class="px-6 py-3 bg-white text-black rounded-xl font-bold hover:bg-zinc-200">Rastrear</button>
      <button onclick="saveWhale()" title="Salvar baleia" class="px-4 py-3 bg-zinc-800 rounded-xl hover:bg-zinc-700">⭐</button>
    </div>

    <div id="result" class="mt-6 hidden"></div>
    <div id="tokenBox" class="mt-4 hidden"></div>
    <div id="txs" class="mt-4 hidden"></div>

    <div class="mt-8">
      <div class="flex justify-between items-center mb-3"><h2 class="font-bold">📋 Minhas baleias salvas</h2><button onclick="clearAll()" class="text-xs text-zinc-500 hover:text-white">limpar tudo</button></div>
      <div id="watchlist" class="grid gap-2"></div>
    </div>

    <div class="mt-10 text-center text-xs text-zinc-600">Feito com NodeReal + Etherscan V2 + Cloudflare Pages • /api/ seguro • 100% transparente com [RAW] verificável</div>
  </div>

<script type="module">
// SEM import.meta.env - agora usa rota segura do seu domínio
async function rpcCall(method, params){
  const r = await fetch('/api/rpc', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0', id:1, method, params})
  });
  const j = await r.json();
  if(j.error) throw new Error(j.error.message || 'RPC error');
  return j.result;
}

async function v2Call(address, chain, action){
  const r = await fetch(`/api/tokeninfo?address=${address}&chain=${chain}&action=${action}`);
  const j = await r.json();
  return j;
}

let bnbPrice = 615;
async function getPrice(){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd');
    const data = await r.json();
    bnbPrice = data.binancecoin.usd;
    document.getElementById('price').innerHTML = `<div class="text-xs text-zinc-500">BNB</div><div class="font-bold">$${bnbPrice}</div>`;
  }catch{ document.getElementById('price').innerHTML = `<div class="text-xs text-zinc-500">BNB</div><div class="font-bold">$${bnbPrice}</div>`; }
}
getPrice();

function getWatchlist(){ try{ return JSON.parse(localStorage.getItem('chainlens_watch')||'[]'); }catch{ return []; } }
function renderWatchlist(){
  const list = getWatchlist();
  const el = document.getElementById('watchlist');
  if(!list.length){ el.innerHTML = '<div class="text-zinc-600 text-sm bg-zinc-900/50 p-4 rounded-xl border border-dashed border-zinc-800">Nenhuma baleia salva ainda. Rastreie e clique na ⭐</div>'; return; }
  el.innerHTML = list.map(w=>`
    <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-xl border border-zinc-800">
      <div class="font-mono text-xs truncate">${w.addr}</div>
      <div class="flex gap-2 items-center">
        <span class="text-xs ${w.bnb>=10000?'text-purple-400':'text-green-400'} font-bold">${w.bnb.toFixed(2)} BNB</span>
        <button onclick="document.getElementById('addr').value='${w.addr}';check();window.scrollTo({top:0,behavior:'smooth'})" class="text-xs bg-white text-black px-3 py-1 rounded-full font-bold">ver</button>
      </div>
    </div>`).join('');
}
renderWatchlist();
window.saveWhale = () => {
  const addrEl = document.getElementById('addr');
  const addr = addrEl.value.trim();
  const bnb = parseFloat(addrEl.dataset.bnb||'0');
  if(!addr) return alert('Cole uma carteira primeiro');
  const list = getWatchlist();
  if(list.find(x=>x.addr.toLowerCase()===addr.toLowerCase())) return alert('Já salva!');
  list.unshift({addr, bnb, at: Date.now()});
  localStorage.setItem('chainlens_watch', JSON.stringify(list.slice(0,20)));
  renderWatchlist();
}
window.clearAll = () => { if(confirm('Limpar todas?')){ localStorage.removeItem('chainlens_watch'); renderWatchlist(); } }

window.check = async () => {
  const addrEl = document.getElementById('addr');
  const addr = addrEl.value.trim();
  const chain = document.getElementById('chain').value;
  const res = document.getElementById('result');
  const tokenBox = document.getElementById('tokenBox');
  const txsDiv = document.getElementById('txs');
  if(!addr || !addr.startsWith('0x')) return alert('Endereço inválido');

  res.classList.remove('hidden');
  res.innerHTML = '<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl animate-pulse">🔍 Consultando via /api/rpc + /api/tokeninfo (transparente)...</div>';
  txsDiv.classList.add('hidden'); tokenBox.classList.add('hidden');

  try{
    // 1. Verifica se é contrato ou carteira (eth_getCode)
    const [balHex, txCountHex, codeHex] = await Promise.all([
      rpcCall('eth_getBalance',[addr,'latest']),
      rpcCall('eth_getTransactionCount',[addr,'latest']).catch(()=> '0x0'),
      rpcCall('eth_getCode',[addr,'latest']).catch(()=> '0x')
    ]);
    const isContract = codeHex && codeHex !== '0x' && codeHex !== '0x0';
    const bnb = parseInt(balHex,16)/1e18;
    const txCount = parseInt(txCountHex,16);
    addrEl.dataset.bnb = bnb;
    const usd = bnb*bnbPrice;

    const score = bnb>=50000? '🔥 LENDÁRIA' : bnb>=10000? '👑 TOP' : bnb>=1000? '🐋 GRANDE' : bnb>=100? '🐋 BALEIA' : '🐟 PEIXE';
    const isTop = bnb>=10000;

    // Render carteira/contrato base
    res.innerHTML = `
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
        <div class="flex justify-between items-center flex-wrap gap-2">
          <span class="text-xs text-zinc-500">${isContract?'CONTRATO / ATIVO • ':'CARTEIRA • '}${txCount} txs • Chain ${chain} <a href="/api/rpc" target="_blank" class="text-violet-400 hover:underline">[RAW RPC]</a></span>
          <span class="text-xs px-3 py-1 rounded-full font-bold ${isTop?'bg-purple-900 text-purple-200 border border-purple-700':'bg-zinc-800 text-zinc-300'}">${isContract?'📄 CONTRATO':'💳 CARTEIRA'} ${score}</span>
        </div>
        <div class="font-mono text-xs mt-3 break-all text-zinc-400 bg-black p-2 rounded border border-zinc-800">${addr} <span class="text-zinc-600">via eth_getCode = ${codeHex.slice(0,10)}... [verificável]</span></div>
        <div class="grid grid-cols-2 gap-3 mt-4">
          <div class="bg-black p-4 rounded-xl border border-zinc-800"><div class="text-xs text-zinc-500">SALDO NATIVO <span class="text-zinc-600">via eth_getBalance</span></div><div class="text-2xl font-bold mt-1">${bnb.toLocaleString('pt-BR',{maximumFractionDigits:4})} ${chain==56?'BNB':'ETH'}</div><div class="text-sm text-zinc-400 mt-1">$${usd.toLocaleString('en-US',{maximumFractionDigits:0})}</div><a href="/api/tokeninfo?address=${addr}&chain=${chain}&action=tokeninfo" target="_blank" class="text-xs text-violet-400">[RAW JSON]</a></div>
          <div class="bg-black p-4 rounded-xl border border-zinc-800"><div class="text-xs text-zinc-500">TIPO</div><div class="text-base font-bold mt-2">${isContract?'Ativo ou Contrato Inteligente<br><span class="text-xs font-normal text-zinc-400">eth_getCode != 0x</span>':'Carteira Externa<br><span class="text-xs font-normal text-zinc-400">eth_getCode == 0x</span>'}</div></div>
        </div>
        <div class="mt-4 flex gap-2">
          <a href="https://bscscan.com/address/${addr}" target="_blank" class="flex-1 text-center text-sm bg-zinc-800 py-3 rounded-xl hover:bg-zinc-700 border border-zinc-700">BscScan ↗</a>
          <a href="https://debank.com/profile/${addr}" target="_blank" class="flex-1 text-center text-sm bg-zinc-800 py-3 rounded-xl hover:bg-zinc-700 border border-zinc-700">DeBank ↗</a>
        </div>
      </div>`;

    // 2. Se for contrato, busca tokeninfo transparente via Etherscan V2
    if(isContract){
      try{
        const info = await v2Call(addr, chain, 'tokeninfo');
        const t = info.result && info.result[0] ? info.result[0] : null;
        if(t){
          tokenBox.classList.remove('hidden');
          const supply = Number(t.totalSupply)/10**Number(t.divisor || 18);
          tokenBox.innerHTML = `
            <div class="bg-zinc-900 border border-violet-900/30 rounded-2xl p-5">
              <div class="font-bold flex justify-between"><span>${t.tokenName} (${t.symbol})</span><span class="text-xs text-zinc-500">via Etherscan V2 chainid=${chain} <a href="/api/tokeninfo?address=${addr}&chain=${chain}&action=tokeninfo" target="_blank" class="text-violet-400">[RAW]</a></span></div>
              <div class="grid grid-cols-3 gap-3 mt-3 text-sm">
                <div class="bg-black p-3 rounded-xl border border-zinc-800"><div class="text-xs text-zinc-500">Supply</div><div class="font-bold">${supply.toLocaleString('pt-BR')}</div></div>
                <div class="bg-black p-3 rounded-xl border border-zinc-800"><div class="text-xs text-zinc-500">Holders</div><div class="font-bold">${t.holderCount || 'N/A'}</div></div>
                <div class="bg-black p-3 rounded-xl border border-zinc-800"><div class="text-xs text-zinc-500">Decimals</div><div class="font-bold">${Math.log10(t.divisor || 1e18)}</div></div>
              </div>
              <div class="mt-3 text-xs text-zinc-500">Contrato: ${t.contractAddress} • Transparente e auditável via /api/tokeninfo</div>
            </div>`;
        }
      }catch(e){ console.log('tokeninfo fail', e); }
    }

    // 3. Transações via V2 seguro (não mais BscScan direto sem key)
    try{
      const txData = await v2Call(addr, chain, 'tokentx');
      let txs = txData.result && Array.isArray(txData.result) ? txData.result.slice(0,8) : [];
      if(txs.length>0){
        txsDiv.classList.remove('hidden');
        const htmlTxs = txs.map(t=>{
          if(!t || !t.value) return '';
          const val = Number(t.value)/1e18;
          if(isNaN(val) || val===0) return '';
          const isOut = t.from && t.from.toLowerCase()===addr.toLowerCase();
          const date = t.timeStamp? new Date(parseInt(t.timeStamp)*1000).toLocaleDateString('pt-BR') : '--';
          return `<div class="flex justify-between items-center py-3 border-b border-zinc-800/50 last:border-0 text-sm">
            <div class="flex items-center gap-2"><span class="${isOut?'bg-red-900/50 text-red-300 border border-red-800/50':'bg-green-900/50 text-green-300 border border-green-800/50'} px-2.5 py-1 rounded-full text-xs font-bold">${isOut?'SAIU':'ENTROU'}</span><span class="font-mono text-xs text-zinc-500">${date}</span></div>
            <div class="font-bold text-right">${val.toFixed(4)} <span class="text-xs text-zinc-500">${t.tokenSymbol || 'BNB'}</span></div>
          </div>`;
        }).filter(Boolean).join('');
        if(htmlTxs){
          txsDiv.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5"><div class="font-bold mb-2">⚡ Últimas movimentações <span class="text-xs text-zinc-500 font-normal">via /api/tokeninfo?action=tokentx <a href="/api/tokeninfo?address=${addr}&chain=${chain}&action=tokentx" target="_blank" class="text-violet-400">[RAW]</a></span></div>${htmlTxs}</div>`;
        }
      } else {
        txsDiv.classList.remove('hidden');
        txsDiv.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-500">Nenhuma transação token encontrada nessa chain via Etherscan V2.</div>`;
      }
    }catch(e){ console.log(e); }

  }catch(e){
    res.innerHTML = `<div class="bg-red-900/20 border border-red-800 p-4 rounded-xl text-red-300"><div class="font-bold">Erro: ${e.message}</div><div class="text-xs mt-2">Verifica se fez push das functions e se as secrets estão em Production na Cloudflare</div></div>`;
  }
}
setTimeout(check, 600);
</script>
</body>
</html>
